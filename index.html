<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mwata Kazembe Kingdom — Official Digital Home</title>
  <meta name="description" content="The official digital home of the Mwata Kazembe Kingdom — governance, Mutomboko, development, and official communications from Mwansabombwe.">
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#405f8f">
  <meta name="msapplication-TileColor" content="#405f8f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
  <link rel="stylesheet" href="src/mobile-editorial.css">
  <link rel="stylesheet" href="src/splash.css">
</head>
<body>

  <!-- Splash screen: removed from DOM after animation completes -->
  <div id="splash" role="status" aria-live="polite" aria-label="Loading Mwata Kazembe Kingdom">
    <img id="splash-coa"
      src="assets/images/kazembe/identity/coat-of-arms.png"
      alt="Mwata Kazembe Coat of Arms"
      width="64" height="64">
    <canvas id="splash-canvas" width="340" height="255" aria-hidden="true"></canvas>
    <div class="splash-messages">
      <span class="splash-msg" data-i="0">Mwaiseni Mwane</span>
      <span class="splash-msg" data-i="1">You Are Welcome</span>
      <span class="splash-msg" data-i="2">Kalombo Mwane</span>
    </div>
    <div id="splash-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  </div>

  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="utility-bar" id="utility-bar" aria-label="Kingdom contact and links"></div>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" data-nav="home">
        <img
          class="brand-coat-of-arms"
          src="assets/images/kazembe/identity/coat-of-arms.png"
          alt="Mwata Kazembe Coat of Arms"
          width="44"
          height="44"
        >
        <span class="brand-text">
          <strong>Mwata Kazembe</strong>
          <span>Kingdom of Kazembe</span>
        </span>
      </a>
      <nav class="primary-nav" id="primary-nav" aria-label="Primary navigation"></nav>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-drawer">
        <span class="menu-toggle-label">Menu</span>
        <span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
  </header>

  <div class="mobile-drawer" id="mobile-drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Mobile navigation menu">
    <div class="mobile-drawer-panel">
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close menu">✕</button>
      <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
    </div>
  </div>

  <main id="main">
    <section class="page page-home active" id="page-home" data-page="home"></section>
    <section class="page" id="page-mwata" data-page="mwata"></section>
    <section class="page" id="page-clans" data-page="clans"></section>
    <section class="page" id="page-governance" data-page="governance"></section>
    <section class="page" id="page-kingdom" data-page="kingdom"></section>
    <section class="page" id="page-mutomboko" data-page="mutomboko"></section>
    <section class="page" id="page-development" data-page="development"></section>
    <section class="page" id="page-newsroom" data-page="newsroom"></section>
    <section class="page" id="page-contact" data-page="contact"></section>
    <section class="page" id="page-museum" data-page="museum"></section>
    <section class="page" id="page-store" data-page="store"></section>
    <section class="page" id="page-donations" data-page="donations"></section>
    <section class="page" id="page-membership" data-page="membership"></section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="src/splash.js"></script>
  <script src="src/vendor/gsap.min.js"></script>
  <script type="module" src="src/app.js"></script>
  <script type="module" src="src/mobile-editorial.js"></script>
</body>
</html>
